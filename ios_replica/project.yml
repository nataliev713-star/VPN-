name: Shadowrocket
options:
  bundleIdPrefix: com.shadowrocket.app
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    DEVELOPMENT_TEAM: ""
    PRODUCT_NAME: "Shadowrocket"

targets:
  Shadowrocket:
    type: application
    platform: iOS
    sources:
      - path: ShadowrocketReplica
        excludes:
          - "PacketTunnel/**"
          - "Resources/PacketTunnel-Info.plist"
    info:
      path: ShadowrocketReplica/Resources/Info.plist
    frameworks:
      - framework: NetworkExtension.framework
      - framework: SystemConfiguration.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shadowrocket.app
        PRODUCT_NAME: "Shadowrocket"
