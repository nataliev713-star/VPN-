name: Build ChatOne Pro IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Generate & Compile IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: ios_chatone
        run: xcodegen generate

      - name: Build Archive
        working-directory: ios_chatone
        run: |
          xcodebuild archive \
            -project ChatOnePro.xcodeproj \
            -scheme ChatOnePro \
            -destination "generic/platform=iOS" \
            -archivePath build/ChatOnePro.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package OTA-Compliant IPA
        working-directory: ios_chatone
        run: |
          mkdir -p build/Payload
          cp -r build/ChatOnePro.xcarchive/Products/Applications/ChatOnePro.app build/Payload/
          
          # Копируем иконки для идеальной совместимости с OTA в IPAMarket
          cp ChatOnePro/Resources/Icons/*.png build/Payload/ChatOnePro.app/
          cp ChatOnePro/Resources/Icons/iTunesArtwork build/Payload/ChatOnePro.app/iTunesArtwork
          
          cd build && zip -r ChatOne-Pro.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatOne-Pro-IPA
          path: ios_chatone/build/ChatOne-Pro.ipa
