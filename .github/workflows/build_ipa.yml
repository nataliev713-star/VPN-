name: Build Shadowrocket IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Generate & Compile IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: ios_replica
        run: xcodegen generate

      - name: Build Archive
        working-directory: ios_replica
        run: |
          xcodebuild archive \
            -project Shadowrocket.xcodeproj \
            -scheme Shadowrocket \
            -destination "generic/platform=iOS" \
            -archivePath build/Shadowrocket.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package OTA-Compliant IPA
        working-directory: ios_replica
        run: |
          mkdir -p build/Payload
          cp -r build/Shadowrocket.xcarchive/Products/Applications/Shadowrocket.app build/Payload/
          
          # Копируем иконки для идеальной совместимости с OTA в IPAMarket
          cp ShadowrocketReplica/Resources/Icons/*.png build/Payload/Shadowrocket.app/
          cp ShadowrocketReplica/Resources/Icons/iTunesArtwork.png build/Payload/Shadowrocket.app/iTunesArtwork
          
          cd build && zip -r Shadowrocket.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shadowrocket-IPA
          path: ios_replica/build/Shadowrocket.ipa
